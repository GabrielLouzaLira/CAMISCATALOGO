<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080908">
  <title>Camisa 10</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="media-attachments.css">
  <link rel="stylesheet" href="clean-empty.css">
  <link rel="stylesheet" href="catalog-enhancements.css">
  <link rel="stylesheet" href="catalog-filters.css">
  <link rel="stylesheet" href="team-selector.css">
  <link rel="stylesheet" href="video-showcase.css">
</head>
<body>
  <a class="skip-link" href="#content">Ir para o catalogo</a>
  <header class="site-header">
    <button class="brand" type="button" data-home aria-label="Voltar ao inicio">
      <span class="brand-mark"><span>10</span></span>
      <span><strong id="brand-name">CAMISA 10</strong><small>CATALOGO DE CAMISETAS</small></span>
    </button>
    <label class="header-search">
      <span aria-hidden="true">Buscar</span>
      <input id="header-search-input" type="search" placeholder="Buscar equipe ou camisa" autocomplete="off" aria-label="Buscar equipe ou camisa">
    </label>
  </header>
  <main id="content"></main>
  <footer><span id="footer-name">CAMISA 10</span><span>Escolha seu time e fale conosco pelo WhatsApp.</span></footer>
  <dialog id="details" class="product-dialog"></dialog>
  <dialog id="film-dialog" class="film-dialog" aria-label="Vídeo Camisa 10">
    <div class="film-dialog__bar"><span>CAMISA 10 · PAIXÃO EM CAMPO</span><button type="button" data-film-close aria-label="Fechar vídeo">×</button></div>
    <video id="catalog-film" controls playsinline preload="none" poster="/showcase/camisa10-momentos.jpg" aria-label="Vídeo de momentos do futebol">
      <source src="/showcase/camisa10-momentos.mp4" type="video/mp4">
      <p>Seu navegador não conseguiu reproduzir o vídeo. <a href="/showcase/camisa10-momentos.mp4">Abrir vídeo</a></p>
    </video>
  </dialog>
  <script src="pricing.js"></script>
  <script src="app-v3.js?v=autoplay-2"></script>
</body>
</html>
